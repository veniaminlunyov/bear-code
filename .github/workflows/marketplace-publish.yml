name: Publish Extension

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

env:
  GIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

jobs:
  publish-extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for pushing tags.
      id-token: write # Required for VS Code Marketplace trusted publishing (OIDC).
    if: >
        ( github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        contains(github.event.pull_request.title, 'Changeset version bump') ) ||
        github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GIT_REF }}
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Package Extension
        run: |
          current_package_version=$(node -p "require('./src/package.json').version")
          pnpm vsix

          # Save VSIX contents to a temporary file to avoid broken pipe issues.
          unzip -l bin/bear-code-${current_package_version}.vsix > /tmp/bear-code-vsix-contents.txt

          # Check for required files.
          grep -q "extension/package.json" /tmp/bear-code-vsix-contents.txt || exit 1
          grep -q "extension/package.nls.json" /tmp/bear-code-vsix-contents.txt || exit 1
          grep -q "extension/dist/extension.js" /tmp/bear-code-vsix-contents.txt || exit 1
          grep -q "extension/webview-ui/audio/celebration.wav" /tmp/bear-code-vsix-contents.txt || exit 1
          grep -q "extension/webview-ui/build/assets/index.js" /tmp/bear-code-vsix-contents.txt || exit 1
          grep -q "extension/assets/codicons/codicon.ttf" /tmp/bear-code-vsix-contents.txt || exit 1
          grep -q "extension/assets/vscode-material-icons/icons/3d.svg" /tmp/bear-code-vsix-contents.txt || exit 1
          
          # Clean up temporary file.
          rm /tmp/bear-code-vsix-contents.txt
      - name: Create and Push Git Tag
        run: |
          current_package_version=$(node -p "require('./src/package.json').version")
          git tag -a "v${current_package_version}" -m "Release v${current_package_version}"
          git push origin "v${current_package_version}" --no-verify
          echo "Successfully created and pushed git tag v${current_package_version}"
      # vsce >= 4.0 (needed for --oidc) requires Node.js >= 22; the project itself stays on Node 20.
      - name: Setup Node.js 22 for vsce
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish Extension to VS Code Marketplace
        run: |
          current_package_version=$(node -p "require('./src/package.json').version")
          # Trusted publishing: no PAT, the GitHub OIDC token is exchanged for a short-lived Marketplace token.
          npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath "bin/bear-code-${current_package_version}.vsix"
          echo "Successfully published version $current_package_version to VS Code Marketplace"
      - name: Publish Extension to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          current_package_version=$(node -p "require('./src/package.json').version")
          pnpm --filter bear-code exec ovsx publish "../bin/bear-code-${current_package_version}.vsix"
          echo "Successfully published version $current_package_version to Open VSX"
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_package_version=$(node -p "require('./src/package.json').version")

          # Extract changelog for current version
          echo "Extracting changelog for version ${current_package_version}"
          # Matches both "## x.y.z" and "## [x.y.z]" headings, up to the next "## " heading
          changelog_content=$(awk -v v="${current_package_version}" '
            /^## / { if (found) exit; h=$0; sub(/^## \[?/, "", h); sub(/\]?[[:space:]]*$/, "", h); if (h == v) { found=1; next } }
            found' CHANGELOG.md)

          # If changelog extraction failed, use a default message
          if [ -z "$changelog_content" ]; then
            echo "Warning: No changelog section found for version ${current_package_version}"
            changelog_content="Release v${current_package_version}"
          else
            echo "Found changelog section for version ${current_package_version}"
          fi

          # Create release with changelog content
          gh release create "v${current_package_version}" \
            --title "BearCode v${current_package_version}" \
            --notes "$changelog_content" \
            --target ${{ env.GIT_REF }} \
            bin/bear-code-${current_package_version}.vsix
          echo "Successfully created GitHub Release v${current_package_version}"
